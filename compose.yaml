services:
  app:
    image: ${COMPOSE_PROJECT_NAME:?Use ./dockerized.sh}-app
    pull_policy: never
    build:
      context: .
      target: dev
    environment:
      BUNDLE_PATH: ${DOCKER_BUNDLE_DIR:?Use ./dockerized.sh}
      GEM_HOME: ${DOCKER_BUNDLE_DIR:?Use ./dockerized.sh}
      BUNDLE_IGNORE_CONFIG: "true"
      BUNDLE_FROZEN: "true"
      BUNDLE_GEMFILE: ${DOCKER_PROJECT_DIR:?Use ./dockerized.sh}/Gemfile
      XDG_CACHE_HOME: ${DOCKER_CACHE_DIR:?Use ./dockerized.sh}
      DPRINT_CACHE_DIR: ${DOCKER_CACHE_DIR:?Use ./dockerized.sh}/dprint
      RUBOCOP_CACHE_ROOT: ${DOCKER_CACHE_DIR:?Use ./dockerized.sh}/rubocop
      BUNDLER_AUDIT_DB: ${DOCKER_CACHE_DIR:?Use ./dockerized.sh}/bundler-audit
      HOME: /tmp
    working_dir: ${DOCKER_PROJECT_DIR:?Use ./dockerized.sh}
    # Rootless UID 0 maps to the daemon user; rootful uses the invoking host user.
    user: "${DOCKERIZED_USER:?Use ./dockerized.sh}"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Preserve absolute paths for commands run from checkout subdirectories.
    volumes:
      - type: bind
        source: .
        target: ${DOCKER_PROJECT_DIR:?Use ./dockerized.sh}
        bind:
          create_host_path: false
    tty: true
    stdin_open: true
    tmpfs:
      - /tmp:mode=1777,exec
      - ${DOCKER_PROJECT_DIR:?Use ./dockerized.sh}/tmp/pids:mode=1777
    ports:
      - "127.0.0.1:3000:3000"
    entrypoint: [
      "${DOCKER_PROJECT_DIR:?Use ./dockerized.sh}/bin/docker-entrypoint",
    ]
    command: ["./bin/rails", "server", "-b", "0.0.0.0"]

  js-tests:
    image: gcr.io/distroless/nodejs26-debian13:nonroot@sha256:1d736cf8b5716c07a245301f92717143215d248fd55771ee1936ef4b3302e531
    pull_policy: never
    profiles: [test]
    working_dir: /workspace
    init: true
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
    command: ["--test", "test/javascript/*_test.js"]

  postgres:
    image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    pull_policy: never
    profiles: [postgres]
    # Tests connect over the Compose network; no host port is needed.
    environment:
      POSTGRES_DB: r3x_test
      POSTGRES_PASSWORD: r3x
      POSTGRES_USER: r3x
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U r3x -d r3x_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    stop_grace_period: 5s

  dockerfile-lint:
    image: ghcr.io/immanuwell/droast:1.7.0@sha256:4f31be49f26804c0a2f8a0ab0ae578719e30376323e8fd5951c6dcc79a478b40
    pull_policy: never
    profiles: [lint]
    user: "${DOCKERIZED_USER:?Use ./dockerized.sh}"
    working_dir: /workspace
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
        bind:
          create_host_path: false
    command: ["Dockerfile"]
