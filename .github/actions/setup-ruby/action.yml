name: Setup project Ruby
description: Install the Ruby version declared in the Dockerfile

inputs:
  bundler-cache:
    description: Install and cache the bundle
    default: 'true'

outputs:
  ruby-version:
    description: Ruby version from the Dockerfile
    value: ${{ steps.ruby-version.outputs.value }}

runs:
  using: composite
  steps:
    - name: Read Ruby version from Dockerfile
      id: ruby-version
      shell: bash
      run: |
        ruby_version=$(sed -n 's/^ARG RUBY_VERSION=//p' Dockerfile)
        if [[ ! "$ruby_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Dockerfile must contain exactly one ARG RUBY_VERSION=x.y.z." >&2
          exit 1
        fi
        echo "value=$ruby_version" >> "$GITHUB_OUTPUT"

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ steps.ruby-version.outputs.value }}
        bundler-cache: ${{ inputs.bundler-cache }}
