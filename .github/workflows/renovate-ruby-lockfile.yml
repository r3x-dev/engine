name: Renovate Ruby Lockfile

on:
  push:
    branches:
      - "renovate/docker.io-library-ruby-*"

permissions:
  contents: read

jobs:
  refresh:
    if: github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          token: ${{ secrets.RENOVATE_FIX_TOKEN }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: false

      - name: Install locked Bundler
        run: gem install bundler -v "$(tail -n 1 Gemfile.lock | tr -d ' ')"

      - name: Align Dockerfile Ruby version
        run: |
          ruby_version = File.read(".ruby-version").strip
          dockerfile = "Dockerfile"
          contents = File.read(dockerfile)

          unless contents.sub!(/^ARG RUBY_VERSION=.*/, "ARG RUBY_VERSION=#{ruby_version}")
            abort "Could not find ARG RUBY_VERSION in #{dockerfile}"
          end

          File.write(dockerfile, contents)
        shell: ruby {0}

      - name: Refresh lockfile Ruby version
        run: bundle update --ruby

      - name: Amend Renovate commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_author: ${{ github.event.head_commit.author.name }} <${{ github.event.head_commit.author.email }}>
          commit_message: ${{ github.event.head_commit.message }}
          commit_options: --amend --no-edit
          commit_user_email: 29139614+renovate[bot]@users.noreply.github.com
          commit_user_name: renovate[bot]
          file_pattern: Dockerfile Gemfile.lock
          push_options: --force-with-lease
          skip_fetch: true
