name: Renovate Ruby Lockfile

on:
  push:
    branches:
      - "renovate/docker.io-library-ruby-*"

permissions:
  contents: read

jobs:
  refresh:
    if: github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: false

      - name: Install locked Bundler
        run: gem install bundler -v "$(tail -n 1 Gemfile.lock | tr -d ' ')"

      - name: Align Dockerfile Ruby version
        run: |
          ruby_version = File.read(".ruby-version").strip
          dockerfile = "Dockerfile"
          contents = File.read(dockerfile)

          unless contents.sub!(/^ARG RUBY_VERSION=.*/, "ARG RUBY_VERSION=#{ruby_version}")
            abort "Could not find ARG RUBY_VERSION in #{dockerfile}"
          end

          File.write(dockerfile, contents)
        shell: ruby {0}

      - name: Refresh lockfile Ruby version
        run: bundle update --ruby

      - name: Detect Renovate changes
        id: changes
        run: |
          if git diff --quiet -- Dockerfile Gemfile.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Renovate GitHub App token
        id: app-token
        if: steps.changes.outputs.changed == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RENOVATE_FIX_APP_ID }}
          private-key: ${{ secrets.RENOVATE_FIX_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Amend and push Renovate commit
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "renovate[bot]"
          git config user.email "29139614+renovate[bot]@users.noreply.github.com"
          git add -- Dockerfile Gemfile.lock
          if git diff --cached --quiet; then
            echo "No Dockerfile or Gemfile.lock changes; nothing to amend."
            exit 0
          fi
          git commit --amend --no-edit
          gh auth setup-git --hostname github.com
          git push --force-with-lease origin "HEAD:${GITHUB_REF_NAME}"
