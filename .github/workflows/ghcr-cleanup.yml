name: Monthly GHCR cleanup
on:
  schedule:
    - cron: '27 3 1 * *' # First day of the month, 03:27 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview which images would be deleted
        type: boolean
        default: true
permissions: {}
jobs:
  cleanup:
    concurrency:
      group: ghcr-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - name: Require the default branch for manual cleanup
        if: github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Run cleanup from the default branch."
            exit 1
          fi

      - name: Delete old images
        uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
        with:
          package: ${{ github.event.repository.name }}
          older-than: 60 days
          keep-n-tagged: 10
          exclude-tags: stable,test
          delete-untagged: true
          delete-partial-images: false
          validate: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
